name: Deploy wabicare.com

# MANUAL ONLY for now. The site was previously deployed by hand with the SWA
# CLI, which is how its source was lost. Once the owner has approved the
# restored build, add the push trigger below so main always matches live:
#
#   push:
#     branches: [main]
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Build and deploy
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static export
        run: npm run build

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: "/"      # Next.js app root
          api_location: "api"    # managed function that delivers demo requests
          output_location: "out" # `output: export` target
          skip_app_build: true   # already built above
