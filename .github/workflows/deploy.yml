name: Deploy wabicare.com

# Deploys on merge to main (and manually via the Actions tab). The build is
# a Next.js static export; the managed function in `api/` delivers leads and
# newsletter signups via Azure Communication Services.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Build and deploy
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static export
        run: npm run build

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: "/"      # Next.js app root
          api_location: "api"    # managed function that delivers demo + newsletter requests
          output_location: "out" # `output: export` target
          skip_app_build: true   # already built above
